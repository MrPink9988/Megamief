<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operation Mega-Mief</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#163026,#080e16 65%);color:#e3eee9;font:16px system-ui,sans-serif;min-height:100vh}main{max-width:920px;margin:auto;padding:24px 18px 40px}header{border-bottom:1px solid #385345;padding-bottom:18px}small,.eyebrow{font:12px monospace;letter-spacing:2px;color:#8af28b}h1{font-size:clamp(28px,6vw,48px);margin:8px 0;letter-spacing:1px}h2{font-size:clamp(24px,4vw,34px);margin:10px 0}p{line-height:1.6;color:#c0d0c9}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:24px 0}.step{border:1px solid #344b43;border-radius:8px;padding:12px 4px;text-align:center;color:#8c9c95;font: bold 15px monospace}.active,.done{color:#a1ff9a;border-color:#7ee785;background:#163d28}.panel{background:#101c25;border:1px solid #344b43;border-radius:16px;padding:clamp(16px,4vw,30px);box-shadow:0 15px 45px #0005}video{width:100%;max-height:65vh;background:#000;border-radius:10px;margin:12px 0}button,input{font:inherit;border-radius:8px;padding:14px}button{background:#8af28b;color:#082415;border:0;font-weight:800;cursor:pointer}button.secondary{background:#23343c;color:#e0eee7;border:1px solid #456052}button:disabled{opacity:.5;cursor:default}input{width:100%;min-width:0;background:#080f17;color:#a1ff9a;border:1px solid #56786a;font: bold 26px monospace;letter-spacing:8px;text-align:center}form{display:flex;gap:10px;margin:18px 0}form input{flex:1}#feedback{min-height:24px;font-weight:bold}.good{color:#a1ff9a}.bad{color:#ff8989}.bar{height:6px;background:#273b36;border-radius:8px;overflow:hidden;margin-top:12px}.bar div{height:100%;background:#8af28b;transition:width .3s}footer{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:12px}footer button{font-size:12px;padding:8px}dialog{background:#14232b;color:#eee;border:1px solid #658578;border-radius:12px;max-width:90vw}dialog button{margin:4px}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}@media(max-width:480px){form{flex-direction:column}.steps{gap:4px}.step{font-size:12px}main{padding:16px 12px}}[hidden]{display:none!important}
</style></head><body><main><header><small>GEHEIMDIENST // KAISERSWERTH · TOP SECRET</small><h1>OPERATION <span style="color:#8af28b">MEGA-MIEF</span></h1><small>AGENT BENJAMIN & TEAM // VERBINDUNG AKTIV</small></header><div class="steps" id="steps"></div><section class="panel" id="panel"></section><div class="bar"><div id="progress"></div></div><footer><small id="count"></small><button class="secondary" id="admin">Spielleitung</button></footer></main><dialog id="control"><h2>Spielleitung</h2><p>Mission direkt aufrufen oder Spiel zurücksetzen.</p><div id="jumps"></div><button id="reset">Neustart</button><button class="secondary" id="close">Schließen</button></dialog><script>
// KONFIGURATION: Beispielcodes und Dateinamen vor dem Geburtstag anpassen.
const missions=[
{code:'1234',title:'Erster Geheimauftrag',video:'Mega-Mief-1-Intro.mp4'},
{code:'2345',title:'Geheimauftrag 02',video:'Mega-Mief-2.mp4'},
{code:'3456',title:'Geheimauftrag 03',video:'Mega-Mief-3.mp4'},
{code:'4567',title:'Geheimauftrag 04',video:'Mega-Mief-4.mp4'},
{code:'5678',title:'Geheimauftrag 05',video:'Mega-Mief-5.mp4'},
{code:'6789',title:'Geheimauftrag 06',video:'Mega-Mief-6.mp4'}];
const finale='Mega-Mief-7-Finale.mp4',key='megamief-v1';
let s={n:0,phase:'start'};try{let x=JSON.parse(localStorage.getItem(key));if(x&&Number.isInteger(x.n)&&x.n>=0&&x.n<=6&&['start','video','task','success','end'].includes(x.phase))s=x}catch(e){}
const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){$('count').title='Speicherung nicht verfügbar'}}function go(n,phase){s={n,phase};save();render()}
function sound(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(ok?520:180,a.currentTime);o.frequency.setValueAtTime(ok?780:120,a.currentTime+.12);g.gain.setValueAtTime(.09,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.start();o.stop(a.currentTime+.36);o.onended=()=>a.close()}catch(e){}}
function render(){let n=s.n,p=s.phase,completed=Math.min(6,n+(p==='success'?1:0));$('steps').innerHTML=missions.map((m,i)=>'<div class="step '+(i<completed?'done':i===n?'active':'')+'">'+(i<completed?'✓ ':'')+'0'+(i+1)+'</div>').join('');$('progress').style.width=completed/6*100+'%';$('count').textContent=completed+' / 6 MISSIONEN ERFÜLLT';let panel=$('panel');
if(p==='start'){panel.innerHTML='<small>VERSCHLÜSSELTE NACHRICHT</small><h2>Agenten, bereit?</h2><p>Eine dringende Nachricht aus der Geheimdienstzentrale wartet auf euch.</p><button id="next">Mission starten ▸</button>';$('next').onclick=()=>go(0,'video');return}
if(p==='video'){panel.innerHTML='<small>EINGEHENDE VIDEOBOTSCHAFT</small><h2>Direktor von Backenhausen</h2><video id="film" controls playsinline preload="metadata"></video><p id="error" class="bad" hidden>Video noch nicht verfügbar. Die Spielleitung kann trotzdem fortfahren.</p><button id="next">'+(n===6?'Finale abschließen':'Auftrag entgegennehmen')+' ▸</button>';$('film').src=n===6?finale:missions[n].video;$('film').onerror=()=>$('error').hidden=false;$('next').onclick=()=>go(n,n===6?'end':'task');return}
if(p==='end'||n===6){panel.innerHTML='<small>STATUS // ERFOLGREICH</small><h2>🏆 Mission erfüllt!</h2><p>Agent Benjamin und sein Team haben Kaiserswerth gerettet. Operation Mega-Mief ist abgeschlossen!</p>';return}
if(p==='success'){panel.innerHTML='<small>CODE AKZEPTIERT</small><h2 class="good">✓ Mission erfüllt!</h2><p>Ausgezeichnet, Agenten. Eine neue Nachricht ist eingetroffen.</p><button id="next">'+(n===5?'Finale öffnen':'Nächste Mission freischalten')+' ▸</button>';$('next').onclick=()=>go(n+1,'video');return}
panel.innerHTML='<small>MISSION 0'+(n+1)+' // AKTIV</small><h2>'+missions[n].title+'</h2><p>Euer lokaler Verbindungsmann hat euren Auftrag vorbereitet. Löst ihn gemeinsam und kehrt mit dem geheimen Zahlencode zur Missionszentrale zurück.</p><form id="codeform"><input id="code" aria-label="Geheimcode" inputmode="numeric" pattern="[0-9]+" autocomplete="off" placeholder="CODE" required><button>Code überprüfen</button></form><div id="feedback" role="status"></div><button class="secondary" id="replay">Videobotschaft erneut ansehen</button>';$('replay').onclick=()=>go(n,'video');$('codeform').onsubmit=e=>{e.preventDefault();if($('code').value.trim()===missions[n].code){sound(true);go(n,'success')}else{sound(false);$('feedback').className='bad';$('feedback').textContent='ZUGRIFF VERWEIGERT – versucht es erneut.';$('code').select()}}}
$('admin').onclick=()=>$('control').showModal();$('close').onclick=()=>$('control').close();$('reset').onclick=()=>{if(confirm('Spiel wirklich zurücksetzen?')){go(0,'start');$('control').close()}};for(let i=0;i<=6;i++){let b=document.createElement('button');b.textContent=i===6?'Finale':'Mission '+(i+1);b.onclick=()=>{go(i,'video');$('control').close()};$('jumps').append(b)}render();
</script></body></html>

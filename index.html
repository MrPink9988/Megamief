<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operation Mega-Mief</title><style>
*{box-sizing:border-box} :root{--accent:#83f4a0;--dim:#8ba69d;--panel:#101d24} body{margin:0;background:radial-gradient(ellipse at top,#18372d,#080e15 65%);color:#eaf4ef;font:16px system-ui,sans-serif;min-height:100vh}body.alert{--accent:#ff7770;background:radial-gradient(ellipse at top,#482020,#080e15 65%)}main{max-width:1150px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #ffffff24;padding-bottom:14px}small,.mono{font:12px monospace;letter-spacing:1.5px;color:var(--accent)}h1{font-size:clamp(24px,4vw,44px);margin:5px 0;line-height:1.1}h1 span{color:var(--accent)}#clock{font:bold clamp(26px,5vw,46px) monospace;color:var(--accent);font-variant-numeric:tabular-nums}.clock{text-align:right;white-space:nowrap}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0 8px}.step{border:1px solid #ffffff24;border-radius:6px;padding:9px;text-align:center;font:bold 14px monospace;color:#82938e}.step.active{border-color:var(--accent);color:var(--accent)}.step.done{background:#153d29;color:#9affad;border-color:#4d9e68}.bar{height:5px;background:#ffffff18;border-radius:5px;overflow:hidden;margin-bottom:18px}.bar div{height:100%;background:#83f4a0;transition:width .4s}.panel{border:1px solid #ffffff25;border-radius:14px;background:var(--panel);overflow:hidden;box-shadow:0 16px 60px #0008}.videohead{display:flex;justify-content:space-between;padding:12px 16px;gap:10px}video{display:block;width:100%;max-height:70vh;background:black;aspect-ratio:16/9}.actions{padding:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button,input{font:inherit;border-radius:8px}button{padding:13px 20px;background:var(--accent);color:#091611;border:0;font-weight:800;cursor:pointer}button.secondary{background:#1d2d35;color:#d5e4df;border:1px solid #ffffff28}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}.terminal{text-align:center;padding:clamp(24px,6vw,70px) 16px;min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center}.terminal h2{font-size:clamp(26px,5vw,46px);margin:12px 0}.terminal p{color:#b7c8c1;max-width:550px}form{width:min(100%,460px);display:grid;gap:12px;margin:20px auto 0}input{width:100%;background:#070e15;color:var(--accent);border:2px solid var(--accent);font:bold clamp(36px,9vw,68px) monospace;letter-spacing:.18em;text-align:center;padding:15px 5px}#feedback{min-height:24px;margin:12px;font-weight:bold;color:#ff8c83}.success{color:#83f4a0}.stamp{font:bold clamp(30px,7vw,65px) monospace;border:3px solid #83f4a0;color:#83f4a0;padding:12px;transform:rotate(-3deg);margin:20px 0}footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}footer button{font-size:11px;padding:7px}dialog{background:#14232b;color:#eee;border:1px solid #658578;border-radius:12px;max-width:92vw;padding:22px}dialog button{margin:4px}dialog input{font:18px monospace;letter-spacing:0;padding:8px;margin:4px 0 10px}dialog label{display:block}dialog::backdrop{background:#000b}[hidden]{display:none!important}@media(max-width:540px){main{padding:12px}header small{letter-spacing:0}.step{padding:7px 2px;font-size:12px}.videohead{font-size:10px}.clock small{font-size:10px}} 
</style></head><body><main><header><div><small>GEHEIMDIENST KAISERSWERTH // TOP SECRET</small><h1>OPERATION <span>MEGA-MIEF</span></h1><small>AGENT BENJAMIN & TEAM</small></div><div class="clock"><small>ZEIT BIS MEGA-MIEF</small><div id="clock">45:00</div></div></header><div class="steps" id="steps"></div><div class="bar"><div id="progress"></div></div><section class="panel" id="panel"></section><footer><small id="count"></small><button class="secondary" id="admin" aria-label="Spielleitung öffnen" title="Spielleitung" style="font-size:20px;opacity:.55;background:transparent;border:0;padding:8px 12px">⚙</button></footer></main>
<dialog id="control"><h2>Spielleitung</h2><p>Codes anpassen, Mission wechseln oder neu starten.</p><div id="settings"></div><button id="savecodes">Codes speichern</button><hr><div id="jumps"></div><button id="reset">↻ Spiel komplett neu starten</button><button class="secondary" id="close">Schließen</button></dialog>
<script>
const videos=['Mega-Mief-1-Intro.mp4','Mega-Mief-2.mp4','Mega-mief-3.mp4','Mega-mief-4.mp4','Mega-mief-5.mp4','Mega-mief-6.mp4'];
const defaults=['0000','0000','0000','0000','0000'],key='megamief-v2',ck='megamief-codes-test-v3',duration=45*60*1000;
const $=id=>document.getElementById(id);let codes=defaults.slice(),s={n:0,phase:'video',start:null};let transition=0;
try{const c=JSON.parse(localStorage.getItem(ck));if(Array.isArray(c)&&c.length===5&&c.every(x=>typeof x==='string'&&/^\d{1,12}$/.test(x)))codes=c;const x=JSON.parse(localStorage.getItem(key));if(x&&Number.isInteger(x.n)&&x.n>=0&&x.n<=5&&['video','task','end'].includes(x.phase)&&!(x.n===5&&x.phase==='task'))s=x}catch(e){}
function store(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function go(n,phase){clearTimeout(transition);s={...s,n,phase};store();render()}
function start(){if(!s.start&&s.n<5){s.start=Date.now();store();tick()}}
function tick(){const left=s.n===5?0:Math.max(0,Math.ceil((duration-(s.start?Date.now()-s.start:0))/1000));$('clock').textContent=s.n===5?'STOPP':String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}
function sound(ok){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.setValueAtTime(ok?520:170,a.currentTime);o.frequency.setValueAtTime(ok?850:110,a.currentTime+.13);g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.start();o.stop(a.currentTime+.36);o.onended=()=>a.close()}catch(e){}}
function render(){const n=s.n,p=s.phase;document.body.classList.toggle('alert',n>=2&&n<5);$('steps').innerHTML=Array.from({length:5},(_,i)=>'<div class="step '+(i<n?'done':i===n?'active':'')+'">'+(i<n?'✓ ':'')+'0'+(i+1)+'</div>').join('');$('progress').style.width=n*20+'%';$('count').textContent=n+' / 5 AUFTRÄGE ERFÜLLT';tick();const panel=$('panel');
if(p==='end'){panel.innerHTML='<div class="terminal"><small class="success">SYSTEM DEAKTIVIERT</small><div class="stamp">MISSION ERFÜLLT</div><h2>KAISERSWERTH IST GERETTET!</h2><p>Agent Benjamin & sein Spezialteam – alle fünf Aufträge erfolgreich abgeschlossen.</p><button class="secondary" id="replay">Finale erneut ansehen</button></div>';$('replay').onclick=()=>go(5,'video');return}
if(p==='video'){panel.innerHTML='<div class="videohead"><small>● EINGEHENDE ÜBERTRAGUNG</small><small>GEHEIMKANAL // 0'+(n+1)+'</small></div><video id="film" playsinline controls preload="auto"></video><div class="actions"><button id="play" hidden>▶ Videobotschaft starten</button><button class="secondary" id="skip">'+(n===5?'Zum Abschluss':'Zur Codeeingabe')+' →</button></div><p id="err" hidden style="padding:0 16px;color:#ff8989">Video konnte nicht geladen werden. Bitte erneut versuchen oder fortfahren.</p>';const v=$('film'),play=$('play');v.src=videos[n];const next=()=>{if($('film')===v)go(n,n===5?'end':'task')};v.onended=next;v.onplaying=()=>{start();play.hidden=true};v.onerror=()=>{$('err').hidden=false;play.hidden=false};$('skip').onclick=()=>{start();next()};const attempt=()=>{v.play().catch(()=>{if($('film')===v)play.hidden=false})};play.onclick=attempt;attempt();return}
panel.innerHTML='<div class="terminal"><small>VERSCHLÜSSELTER ZUGANG // AUFTRAG 0'+(n+1)+'</small><h2>GEHEIMCODE EINGEBEN</h2><p>Löst den Auftrag eures Verbindungsmanns und übermittelt den Code.</p><form id="form"><input id="code" aria-label="Geheimcode" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••" required><button>CODE BESTÄTIGEN ↵</button></form><div id="feedback" role="status"></div><button class="secondary" id="replay">Videobotschaft wiederholen</button></div>';const input=$('code');input.oninput=()=>{input.value=input.value.replace(/\D/g,'')};$('replay').onclick=()=>go(n,'video');$('form').onsubmit=e=>{e.preventDefault();if(input.value===codes[n]){sound(true);s.n=n+1;s.phase='video';store();$('progress').style.width=s.n*20+'%';$('count').textContent=s.n+' / 5 AUFTRÄGE ERFÜLLT';$('steps').children[n].className='step done';$('steps').children[n].textContent='✓ 0'+(n+1);panel.innerHTML='<div class="terminal"><small class="success">AUTHENTIFIZIERUNG ERFOLGREICH</small><div class="stamp">CODE AKZEPTIERT</div><p>Neue Videobotschaft wird entschlüsselt …</p><button id="continue">Weiter ▶</button></div>';$('continue').onclick=()=>go(n+1,'video');transition=setTimeout(()=>go(n+1,'video'),1500)}else{sound(false);$('feedback').textContent='ZUGRIFF VERWEIGERT – versucht es erneut.';input.select()}};if(matchMedia('(pointer:fine)').matches)input.focus()}
$('admin').onclick=()=>{$('settings').innerHTML=codes.map((c,i)=>'<label>Auftrag '+(i+1)+'<input id="setting'+i+'" inputmode="numeric" value="'+c+'"></label>').join('');$('control').showModal()};$('savecodes').onclick=()=>{const c=codes.map((_,i)=>$('setting'+i).value.trim());if(!c.every(x=>/^\d{1,12}$/.test(x))){alert('Bitte nur Ziffern eingeben.');return}codes=c;try{localStorage.setItem(ck,JSON.stringify(c))}catch(e){}$('control').close()};$('close').onclick=()=>$('control').close();$('reset').onclick=()=>{if(confirm('Alle Fortschritte und den Countdown zurücksetzen? Die Rätselcodes bleiben erhalten.')){s={n:0,phase:'video',start:null};$('control').close();go(0,'video')}};for(let i=0;i<=5;i++){const b=document.createElement('button');b.className='secondary';b.textContent=i===5?'Finale':'Auftrag '+(i+1);b.onclick=()=>{$('control').close();go(i,'video')};$('jumps').append(b)}setInterval(tick,500);render();
</script></body></html>
